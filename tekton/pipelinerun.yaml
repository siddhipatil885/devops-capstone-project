apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: cd-pipeline-run-
spec:
  pipelineRef:
    name: cd-pipeline
  serviceAccountName: pipeline
  params:
    - name: image
      value: us.icr.io/sn-labs-siddhipatil2/accounts:1
  workspaces:
    - name: pipeline-workspace
      volumeClaimTemplate:
        spec:
          storageClassName: skills-network-learner
          accessModes: [ReadWriteMany]
          resources:
            requests:
              storage: 1Gi
