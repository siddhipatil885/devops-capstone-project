[nosetests]
verbosity=1
exe=1
tests=tests.test_models,tests.test_routes,tests.test_cli_commands
with-spec=1
spec-color=1
with-coverage=1
cover-package=service
cover-min-percentage=95

[coverage:report]
show_missing = True

[flake8]
max-line-length=127
max-complexity=10
exclude=.git,.venv,.venv39,.starter,.tools,.python,evidence
per-file-ignores =
    */__init__.py: F401 E402

[pylint.'MESSAGES CONTROL']
disable=E1101
